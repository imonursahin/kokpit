name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.3.0. Leave empty for the next patch version.
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick the version
        id: ver
        env:
          WANTED: ${{ inputs.version }}
        run: |
          LAST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null | sed 's/^v//')
          if [ -n "$WANTED" ]; then
            VER="${WANTED#v}"
          elif [ -z "$LAST" ]; then
            VER=$(node -p "require('./package.json').version")
          else
            VER=$(node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); console.log(`${a}.${b}.${c + 1}`)' "$LAST")
          fi
          EXISTING=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$WANTED" ] && [ -n "$EXISTING" ]; then VER="${EXISTING#v}"; fi
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Invalid version: $VER"; exit 1; fi
          echo "Releasing $VER (last release: ${LAST:-none})"
          echo "v=$VER" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Write release notes from the commits since the last release
        env:
          LAST: ${{ steps.ver.outputs.last }}
        run: |
          RANGE=HEAD
          if [ -n "$LAST" ] && git rev-parse -q --verify "refs/tags/v$LAST" >/dev/null; then RANGE="v$LAST..HEAD"; fi
          git log --no-merges --format=%s "$RANGE" > subjects.txt
          node scripts/release-notes.cjs subjects.txt > notes.md
          cat notes.md

      - name: Restore the Electron and electron-builder downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-dl-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: electron-dl-${{ runner.os }}-${{ runner.arch }}-

      - name: Install, test and build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VER: ${{ steps.ver.outputs.v }}
        run: |
          npm ci
          npm version "$VER" --no-git-tag-version --allow-same-version
          npm test
          npm run typecheck
          npm run dist

      - name: Save the Electron and electron-builder downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-dl-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the release
        env:
          VER: ${{ steps.ver.outputs.v }}
        run: |
          DRAFT=$(gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$DRAFT" = "false" ]; then
            echo "v$VER is already released; using its published DMG for the cask"
            gh release download "v$VER" --repo "$GITHUB_REPOSITORY" --pattern "Kokpit-$VER-arm64.dmg" --dir dist --clobber
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then gh release delete "v$VER" --repo "$GITHUB_REPOSITORY" --yes; fi
          gh release create "v$VER" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Kokpit $VER" --notes-file notes.md \
            "dist/Kokpit-$VER-arm64.dmg" "dist/Kokpit-$VER-arm64-mac.zip"
          gh release edit "v$VER" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Update the Homebrew cask
        env:
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VER: ${{ steps.ver.outputs.v }}
        run: |
          SHA=$(shasum -a 256 "dist/Kokpit-$VER-arm64.dmg" | awk '{print $1}')
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:imonursahin/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VER/" -e "s/@SHA@/$SHA/" -e "s#@REPO@#$GITHUB_REPOSITORY#" build/kokpit.rb > tap/Casks/kokpit.rb
          cd tap
          git config user.name "Onur Şahin"
          git config user.email "31903339+imonursahin@users.noreply.github.com"
          git add Casks/kokpit.rb
          if ! git diff --cached --quiet; then
            git commit -m "kokpit $VER"
            git push
          fi
